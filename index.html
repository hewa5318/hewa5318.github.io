<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hewa · Portfolio</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #6b6b6b;
      --line: #d9d9d9;
      --accent: #2f7d4f;
      --bg: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 56px 20px 80px;
    }
    .label {
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }
    h1 {
      font-family: "Nanum Myeongjo", "Batang", serif;
      font-size: clamp(30px, 6vw, 44px);
      font-weight: 700;
      margin: 8px 0 12px;
    }
    .intro { color: var(--muted); margin: 0 0 40px; }
    hr { border: 0; border-top: 1px solid var(--ink); margin: 0 0 8px; }
    .project {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 22px 0;
      border-bottom: 1px solid var(--line);
    }
    .project h2 { font-size: 20px; margin: 0; }
    .num { color: var(--accent); margin-right: 10px; font-weight: 700; }
    .links a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--accent);
      margin-left: 16px;
      font-size: 15px;
    }
    .links a:first-child { margin-left: 0; }
    .links a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="label">Portfolio · 2026</p>
    <h1>hewa</h1>
    <p class="intro">콘텐츠 서비스 기획</p>

    <p class="label">Projects</p>
    <hr>

    <div class="project">
      <h2><span class="num">01</span>주차장 혼잡 지도</h2>
      <div class="links">
        <a href="https://hewa5318.github.io/parking-congestion-map/">시연 보기</a>
        <a href="https://github.com/hewa5318/parking-congestion-map">코드 보기</a>
      </div>
    </div>
  </main>
</body>
</html>
